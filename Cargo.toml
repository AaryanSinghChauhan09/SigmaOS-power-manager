[package]
name = "sigmaos-power-manager"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Power management and battery optimization"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-power-manager"
readme = "README.md"
keywords = ["power", "battery", "pm"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
